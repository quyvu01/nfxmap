name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    # The NATS integration tests run against it
    services:
      nats:
        image: nats:2.11
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          NATS_URL: nats://localhost:4222
      - run: npm run build
      # The published files: the ESM and CommonJS entry points load
      - run: |
          cd packages/nfxmap
          node -e "require('nfxmap'); require('nfxmap/expressions')"
          node --input-type=module -e "await import('nfxmap'); await import('nfxmap/expressions')"
          cd ../nfxmap-nats
          node -e "require('nfxmap-nats')"
          node --input-type=module -e "await import('nfxmap-nats')"
