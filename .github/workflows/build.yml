name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    # The integration tests run against them
    services:
      nats:
        image: nats:2.11
        ports:
          - 4222:4222
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nfxmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      rabbitmq:
        image: rabbitmq:4.1
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 20
      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 20s --health-retries 20
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.14
        ports:
          - 9324:9324
    steps:
      - uses: actions/checkout@v4
      # The Service Bus emulator reads its queues from a file of the repository, so it starts after the checkout
      - name: Start the Service Bus emulator
        run: |
          docker network create servicebus
          docker run -d --name sql --network servicebus -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=Fxmap_Passw0rd! \
            mcr.microsoft.com/mssql/server:2022-latest
          docker run -d --name servicebus --network servicebus -p 5673:5672 -p 5300:5300 -e SQL_SERVER=sql \
            -e MSSQL_SA_PASSWORD=Fxmap_Passw0rd! -e ACCEPT_EULA=Y \
            -v "$PWD/packages/nfxmap-azure-servicebus/test/servicebus-emulator.json:/ServiceBus_Emulator/ConfigFiles/Config.json" \
            mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Wait for the Service Bus emulator
        run: |
          for i in $(seq 1 90); do curl -sf localhost:5300/health && exit 0; sleep 2; done
          docker logs servicebus
          exit 1
      - run: npm test
        env:
          NATS_URL: nats://localhost:4222
          PG_URL: postgres://postgres:postgres@localhost:5432/nfxmap
          MONGO_URL: mongodb://localhost:27017
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          KAFKA_BROKERS: localhost:9092
          SQS_ENDPOINT: http://localhost:9324
          SERVICEBUS_CONNECTION_STRING: >-
            Endpoint=sb://localhost:5673;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      - run: npm run build
      # The published files: the ESM and CommonJS entry points load
      - run: |
          cd packages/nfxmap
          node -e "require('nfxmap'); require('nfxmap/expressions')"
          node --input-type=module -e "await import('nfxmap'); await import('nfxmap/expressions')"
          cd ../nfxmap-nats
          node -e "require('nfxmap-nats')"
          node --input-type=module -e "await import('nfxmap-nats')"
          cd ../nfxmap-typeorm
          node -e "require('nfxmap-typeorm')"
          node --input-type=module -e "await import('nfxmap-typeorm')"
          cd ../nfxmap-mongodb
          node -e "require('nfxmap-mongodb')"
          node --input-type=module -e "await import('nfxmap-mongodb')"
          cd ../nfxmap-rabbitmq
          node -e "require('nfxmap-rabbitmq')"
          node --input-type=module -e "await import('nfxmap-rabbitmq')"
          cd ../nfxmap-kafka
          node -e "require('nfxmap-kafka')"
          node --input-type=module -e "await import('nfxmap-kafka')"
          cd ../nfxmap-grpc
          node -e "require('nfxmap-grpc')"
          node --input-type=module -e "await import('nfxmap-grpc')"
          cd ../nfxmap-sqs
          node -e "require('nfxmap-sqs')"
          node --input-type=module -e "await import('nfxmap-sqs')"
          cd ../nfxmap-azure-servicebus
          node -e "require('nfxmap-azure-servicebus')"
          node --input-type=module -e "await import('nfxmap-azure-servicebus')"
          cd ../nfxmap-graphql
          node -e "require('nfxmap-graphql')"
          node --input-type=module -e "await import('nfxmap-graphql')"
          cd ../nfxmap-opentelemetry
          node -e "require('nfxmap-opentelemetry')"
          node --input-type=module -e "await import('nfxmap-opentelemetry')"
