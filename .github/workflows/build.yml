name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The published files: the ESM and CommonJS entry points load
      - run: |
          cd packages/nfxmap
          node -e "require('nfxmap'); require('nfxmap/expressions')"
          node --input-type=module -e "await import('nfxmap'); await import('nfxmap/expressions')"
